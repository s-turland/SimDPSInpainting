<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimDPS GS-1</title>
<style>
/* the page is the instrument face; the display carries the whole interface.
   #panel (default), #paged or #vfd picks the display */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #1c1d1e; }
body { padding: 24px 16px; }
.unit { max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; justify-items: center; }
.bezel { width: 100%; background: #0a0a0a; padding: 12px; }
.glass { display: flex; justify-content: center; }
canvas { display: block; touch-action: none; }
.keys { display: grid; grid-template-columns: repeat(8, 1fr); }
.keys button {
  height: 26px; margin: 0 9%; border: 0; border-radius: 0; cursor: pointer;
  background: #2c2e31; box-shadow: inset 0 -3px 0 #121314;
}
.keys button:active { box-shadow: inset 0 2px 0 #121314; }
.keys button:focus-visible { outline: 1px solid #8a8f96; outline-offset: 2px; }
</style>
</head>
<body>
<div class="unit">
  <div class="bezel"><div class="glass"><canvas id="lcd" aria-label="SimDPS display" tabindex="0"></canvas></div></div>
  <div class="keys" id="keys" hidden></div>
</div>
<script src="lcd.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script>
  const LOOKS = {
    panel: { bg: "#8c9b8a", ghost: "#97a694", ink: "#18221c" },
    paged: { bg: "#0f1631", ghost: "#16204a", ink: "#dbe6ff" },
    vfd: { bg: "#040605", ghost: "#0b1512", ink: "#7af5dc", glow: "#2fd8b8" },
  };
  const mode = LOOKS[location.hash.slice(1)] ? location.hash.slice(1) : "panel";
  const cv = document.getElementById("lcd"), row = document.getElementById("keys");
  if (mode === "vfd") document.querySelector(".bezel").style.background = "#040605";
  if (mode === "paged") {
    row.hidden = false;
    for (let i = 0; i < 8; i++) {
      const b = document.createElement("button");
      b.setAttribute("aria-label", "soft key " + (i + 1) + " (F" + (i + 1) + ")");
      b.onclick = () => GS1.press(i);
      row.append(b);
    }
  }
  window.addEventListener("hashchange", () => location.reload());
  GS1(cv, { mode, look: LOOKS[mode], after: () => { row.style.width = cv.style.width; } });
</script>
</body>
</html>
